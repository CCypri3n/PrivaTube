<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrivaTube</title>
    <link rel="stylesheet" href="web/styles.css">
    <link rel="icon" href="web/icons/icon-96.png">
</head>

<body>
    <script src="web/shell-markup.js"></script>
    <script>ShellMarkup.insert();</script>

    <div id="channel-banner" style="display:none;"></div>

    <div id="results" class="video-grid"></div>

    <div id="load-more-wrapper">
        <button id="load-more-btn" style="display:none;">Load More</button>
    </div>

    <script src="web/apikey.js"></script>
    <script src="web/route.js"></script>
    <script src="web/safetext.js"></script>
    <script src="web/settings.js"></script>
    <script src="web/shorts.js"></script>
    <script src="web/youtube.js"></script>
    <script src="web/shell.js"></script>
    <script src="web/PrivaTube.js"></script>
    <div id="share-modal" style="display:none;">
    <div class="api-key-modal-backdrop"></div>
    <div class="api-key-modal-content">
        <h2>Share this video</h2>
        <div class="share-link-row">
            <input id="share-link" type="text" readonly>
            <button id="copy-share-link-btn" title="Copy link">Copy</button>
        </div>
        <button id="share-close-btn" class="button" style="margin-top:12px;">Close</button>
        <p class="attention" style="margin-top:8px;">Copy and share this link.</p>
    </div>
    </div>

</body>
</html>
