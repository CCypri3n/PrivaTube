<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PrivaTube</title>
    <link rel="stylesheet" href="web/styles.css">
    <link rel="icon" href="web/icons/icon-96.png">
</head>

<body>
    <script src="web/shell-markup.js"></script>
    <script>ShellMarkup.insert();</script>

    <div id="video-player-wrapper">
        <div id="video"></div>
        <div id="video-error" class="video-error" role="alert" style="display:none;"></div>
        <div id="video-info">
            <h2 id="video-title" class="video-title"></h2>
            <div id="video-channel" class="video-channel">
            <a id="channel-link" href="#" target="_self">
                <img id="channel-avatar" class="channel-avatar" src="" alt="Channel Avatar">
            <div class="channel-info">
                <span id="channel-name" class="channel-name"></span>
                <span id="channel-subscribers" class="channel-subscribers"></span>
            </div>
            </a>
            <div class="channel-actions">
                <span id="channel-likes" class="channel-likes"></span>
                <button id="share-btn" title="Share this video" class="channel-action-btn">
                <img src="web/icons/share-96.svg" alt="Share" style="width:28px;height:28px">
                </button>
            </div>
            </div>
    </div>
    <div id="video-stats">
        <div class="stats-row">
            <span id="view-count" class="video-stat"></span>
            <span id="video-published-date" class="video-stat"></span>
        </div>
        <p id="video-description" class="video-description"></p>
    </div>
    <div id="comment-action-wrapper">
    <span id="comment-count" class="comment-count"></span>
    <div class="comment-sort-wrapper">
        <button id="comment-sort-btn">
        <img src="web/icons/sort-96.svg" alt="Sort Comments" style="width:24px;height:24px;vertical-align:middle;">
        <span id="comment-sort-label">Sort by</span>
        </button>
        <div class="comment-list" id="comment-list">
        <div data-code="popular">Top comments</div>
        <div data-code="recent">Newest first</div>
        </div>
    </div>
    </div>
            
    </div>
    <div id="comment-wrapper" class="comment-wrapper"></div>
    <div id="load-more-wrapper">
        <button id="load-more-btn" style="display:none;">Load More</button>
    </div>

    <script src="web/apikey.js"></script>
    <script src="web/route.js"></script>
    <script src="web/safetext.js"></script>
    <script src="web/settings.js"></script>
    <script src="web/shorts.js"></script>
    <script src="web/youtube.js"></script>
    <script src="web/shell.js"></script>
    <script src="web/VideoPlayer.js"></script>

    <div id="share-modal" style="display:none;">
    <div class="api-key-modal-backdrop"></div>
    <div class="api-key-modal-content">
        <h2>Share this video</h2>
        <div class="share-link-row">
            <input id="share-link" type="text" readonly>
            <button id="copy-share-link-btn" title="Copy link">Copy</button>
        </div>
        <button id="share-close-btn" class="button" style="margin-top:12px;">Close</button>
        <p class="attention" style="margin-top:8px;">Copy and share this link.</p>
    </div>
    </div>

</body>
</html>
